# The endpoint picker, generated from the llm-d router gateway chart v0.9.0 and
# vendored here so the cluster is built from plain manifests rather than a Helm
# release resolved at run time.
#
# Setup applies this and the episode never shows it. Eight objects of service
# account, RBAC, config and Deployment are the picker's plumbing, in the same way
# Flux and KEDA are plumbing: correct to have, not the subject. What the episode
# does show is the InferencePool, which names this picker in four lines and is
# where the intent actually lives.
#
# MEMORY IS OVERRIDDEN AND HAS TO BE. The chart requests 8Gi by default, which is
# a sane production figure and does not fit the general node pool this series
# runs -- e2-standard-2 has about 6Gi allocatable, the picker carries no GPU
# toleration so it cannot land on a GPU node either, and the result is a Pod that
# sits Pending forever while everything else looks healthy. 128Mi request against
# a 512Mi limit is what the vendor's own guide uses and is ample for one pool of
# three replicas; raise it for a large fleet, where the picker's index grows.
#
# Regenerate with:
#   helm template silly-model oci://ghcr.io/llm-d/charts/llm-d-router-gateway \
#     --version v0.9.0 --namespace inference \
#     --set router.modelServers.matchLabels.app=silly-model \
#     --set router.epp.resources.requests.cpu=100m \
#     --set router.epp.resources.requests.memory=128Mi \
#     --set router.epp.resources.limits.memory=512Mi \
#     --set provider.name=none --set httpRoute.create=true \
#     --set httpRoute.inferenceGatewayName=inference-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silly-model-epp
  namespace: inference
  labels:
    app.kubernetes.io/name: silly-model-epp
    app.kubernetes.io/version: "v0.9.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: silly-model-epp
  namespace: inference
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: silly-model-epp-non-sa
  namespace: inference
  labels:
    app.kubernetes.io/name: silly-model-epp
    app.kubernetes.io/version: "v0.9.0"
rules:
- apiGroups: ["inference.networking.x-k8s.io"]
  resources: ["inferenceobjectives", "inferencemodelrewrites"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["llm-d.ai"]
  resources: ["inferenceobjectives", "inferencemodelrewrites"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["inference.networking.k8s.io"]
  resources: ["inferencepools"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: silly-model-epp-sa
  namespace: inference
  labels:
    app.kubernetes.io/name: silly-model-epp
    app.kubernetes.io/version: "v0.9.0"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: silly-model-epp-non-sa
  namespace: inference
subjects:
- kind: ServiceAccount
  name: silly-model-epp
  namespace: inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: silly-model-epp-non-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: silly-model-epp-sa
  namespace: inference
subjects:
- kind: ServiceAccount
  name: silly-model-epp
  namespace: inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: silly-model-epp-sa
---
apiVersion: v1
kind: Service
metadata:
  name: silly-model-epp
  namespace: inference
  labels:
    app.kubernetes.io/name: silly-model-epp
    app.kubernetes.io/version: "v0.9.0"
spec:
  selector:
    llm-d-router-gateway: silly-model-epp
  ports:
    - name: grpc-ext-proc
      protocol: TCP
      port: 9002
    - name: http-metrics
      protocol: TCP
      port: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silly-model-epp
  namespace: inference
  labels:
    app.kubernetes.io/name: silly-model-epp
    app.kubernetes.io/version: "v0.9.0"
    llm-d.ai/igw-mode: llm-d-router-gateway
spec:
  replicas: 1
  strategy:
    # The current recommended EPP deployment pattern is to have a single active replica. This ensures
    # optimal performance of the stateful operations such prefix cache aware scorer.
    # The Recreate strategy the old replica is killed immediately, and allow the new replica(s) to
    # quickly take over. This is particularly important in the high availability set up with leader
    # election, as the rolling update strategy would prevent the old leader being killed because
    # otherwise the maxUnavailable would be 100%.
    type: Recreate
  selector:
    matchLabels:
      llm-d-router-gateway: silly-model-epp
  template:
    metadata:
      labels:
        llm-d-router-gateway: silly-model-epp
        llm-d.ai/igw-mode: llm-d-router-gateway
    spec:
      serviceAccountName: silly-model-epp
      # Conservatively, this timeout should mirror the longest grace period of the pods within the pool
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
          imagePullPolicy: IfNotPresent
          args:
              - --pool-name
              - silly-model
              # The pool namespace is optional because EPP can default to the NAMESPACE env var.
              - --pool-namespace
              - inference
              - --pool-group
              - "inference.networking.k8s.io"
              - --zap-encoder
              - "json"
              - --config-file
              - "/config/default-plugins.yaml"
              - --grpc-health-port
              - "9003"
              # Pass additional flags via the router.epp.flags field in values.yaml.
              # Render them as --flag=value so boolean values are parsed correctly.
              - --tracing=false
          resources:
            
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            periodSeconds: 2
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
        
      volumes:
        - name: plugins-config-volume
          configMap:
            name: silly-model-epp
