# Routing to a pool rather than to a Service. `backendRefs` naming an
# InferencePool is the only unusual line here; everything else is an ordinary
# HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silly-model
  namespace: inference
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: silly-model
      matches:
        - path:
            type: PathPrefix
            value: /
      # This has to outlast a cold start, and 300s does not. Measured: with the
      # model scaled to zero, a held request was answered at 320s and the route
      # gave up at 300, returning a 504 that reads like the model failing when
      # in fact the gateway held the request correctly and then stopped waiting.
      # The autoscaling video measured cold starts near ten minutes.
      timeouts:
        request: 900s
