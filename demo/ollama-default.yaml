apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: inference
  labels:
    app: silly-model
    engine: ollama
spec:
  replicas: 1
  progressDeadlineSeconds: 2700
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silly-model
      engine: ollama
  template:
    metadata:
      labels:
        app: silly-model
        engine: ollama
    spec:
      enableServiceLinks: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.32.14
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:8000
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 120
---
apiVersion: v1
kind: Service
metadata:
  name: silly-model
  namespace: inference
  labels:
    app: silly-model
spec:
  selector:
    app: silly-model
  ports:
    - port: 8000
      targetPort: http
