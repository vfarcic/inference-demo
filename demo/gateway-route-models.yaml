# One route, two rules, matching on the header the policy just wrote. Everything
# else is an ordinary HTTPRoute; the only unusual thing is that the value being
# matched came out of the request body.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silly-model
  namespace: inference
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - type: Exact
              name: X-Gateway-Base-Model-Name
              value: qwen3-8b
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: silly-model
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - type: Exact
              name: X-Gateway-Base-Model-Name
              value: qwen3-06b
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: small-model
      timeouts:
        request: 300s
