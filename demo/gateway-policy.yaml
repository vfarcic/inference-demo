# The part an ordinary gateway cannot do: the model name lives in the JSON
# body, so path and header matching cannot see it. This reads the body before
# routing and writes what it finds into a header the HTTPRoute can match on.
# Upstream wraps the value in a name-to-model map, which buys LoRA aliasing;
# we pass the name through. See the manuscript notes for why.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: inference-model-routing
  namespace: inference
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: X-Gateway-Base-Model-Name
            value: string(json(request.body).model)
