# This is the part an ordinary gateway cannot do. The model name lives in the
# JSON body, not in the URL or a header, so path and header matching cannot see
# it. The policy reads the body before routing happens and writes what it finds
# into a header the HTTPRoute can then match on.
#
# Upstream examples wrap this in a map from request name to base model, which
# buys aliasing: several names resolving to one model, which is how LoRA
# adapters reach the replica already serving their base. We pass the name
# through instead. Two reasons. The map reads as an identity map to anyone
# seeing it once, and explaining why it is not costs a paragraph the episode
# does not have. And a literal map has to list every servable name, so a third
# pool means editing a file the video already showed on camera.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: inference-model-routing
  namespace: inference
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: X-Gateway-Base-Model-Name
            value: string(json(request.body).model)
