apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
  labels:
    app: silly-model
    engine: vllm
spec:
  replicas: 1
  progressDeadlineSeconds: 2700
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silly-model
      engine: vllm
  template:
    metadata:
      labels:
        app: silly-model
        engine: vllm
    spec:
      enableServiceLinks: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          args:
            - --model
            - Qwen/Qwen3-8B
            - --served-model-name
            - qwen3-8b
            - --max-model-len
            - "8192"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 120
---
apiVersion: v1
kind: Service
metadata:
  name: silly-model
  namespace: inference
  labels:
    app: silly-model
spec:
  selector:
    app: silly-model
  ports:
    - port: 8000
      targetPort: http
